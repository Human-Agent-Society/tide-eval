schema_version = "1.4"

# Only declared artifacts cross into the verifier container.
artifacts = ["/app/best/solution.json", "/app/best/score_log.jsonl"]

[task]
name = "tide/string-compression"
description = "Compress a fixed corpus: ship a decompressor + payload; reward = corpus bytes / (decompressor + payload bytes), exact round-trip required."

[metadata]
category = "autoresearch"

[agent]
# The timeout IS the budget; a timeout is a normal ending and the verifier
# still grades the best-so-far snapshot.
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
network_mode = "no-network"
