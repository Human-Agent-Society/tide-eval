[project]
name = "tide-eval"
version = "0.1.0"
description = "Continual evaluation infrastructure on the Harbor task standard: episodes, streams, and metrics for autoresearch and continual-learning benchmarks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["evaluation", "benchmarks", "agents", "continual-learning", "autoresearch", "harbor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/Human-Agent-Society/tide-eval"
Issues = "https://github.com/Human-Agent-Society/tide-eval/issues"

[project.optional-dependencies]
# The Harbor executor. Kept optional so the core (store, metrics, fakes,
# stream tooling) works without Harbor's heavy dependency tree.
harbor = ["harbor==0.20.0"]
# The default OpenAI-compatible client for the probe executor.
probe = ["openai>=1.40"]
# Benchmark converters (EdgeBench spec parsing).
converters = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tide"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Fixtures include third-party generated task code (FrontierCS export).
extend-exclude = ["tests/fixtures", "tasks/frontier-cs", "tasks/edgebench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
