[project]
name = "tide-eval"
version = "0.1.0"
description = "Continual evaluation infrastructure on the Harbor task standard: episodes, streams, and metrics for autoresearch and continual-learning benchmarks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
# The Harbor executor. Kept optional so the core (store, metrics, fakes,
# stream tooling) works without Harbor's heavy dependency tree.
harbor = ["harbor==0.20.0"]
# The default OpenAI-compatible client for the probe executor.
probe = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tide"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
