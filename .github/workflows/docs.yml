name: Docs

# Builds the MkDocs site (docs/ -> site/) and deploys it to Vercel:
# production on main pushes, preview on PRs. The build runs on the Actions
# runner (`vercel build` executes vercel.json's buildCommand locally), so
# Vercel's own build image never needs Python.
#
# One-time setup: `npx vercel link` the repo to a Vercel project, then set
# three repo secrets — VERCEL_TOKEN (vercel.com/account/tokens),
# VERCEL_ORG_ID and VERCEL_PROJECT_ID (both in .vercel/project.json).

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, vercel.json, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, vercel.json, .github/workflows/docs.yml]

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: >
          vercel pull --yes
          --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build site (runs vercel.json's buildCommand)
        run: >
          vercel build
          ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt output
        run: >
          vercel deploy --prebuilt
          ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
