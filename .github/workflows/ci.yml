name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest pytest-asyncio ruff
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (core — harbor-dependent tests skip)
        run: uv run pytest tests/ -q
      - name: Examples run offline
        run: |
          uv run python examples/quickstart.py
      - name: CLI smoke (offline)
        run: |
          uv run tide list
          uv run tide run autoresearch --agent oracle --fake --lab runs/ci-smoke
          uv run tide stream ci-week autoresearch --agent oracle --fake --lab runs/ci-smoke
          uv run tide report --lab runs/ci-smoke
      - name: Local mode (real scoring, no Docker)
        run: |
          uv run tide run autoresearch/circle-packing --local \
            --command "python examples/minimal_harness_search.py" \
            --budget 0.002 --lab runs/ci-local
          uv run tide report --lab runs/ci-local
