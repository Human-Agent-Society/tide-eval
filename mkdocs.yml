site_name: tide
site_description: Evaluate agents on autoresearch tasks — continuous scores, budget semantics, trusted results.
repo_url: https://github.com/Human-Agent-Society/tide-eval
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Introduction:
      - Get started: introduction/get-started.md
      - Design: introduction/design.md
  - Guides:
      - Evaluating your agent: guides/integration.md
      - Authoring tasks & benchmarks: guides/authoring-tasks.md
  - API:
      - Lab & store: api/lab.md
      - Budget: api/budget.md
      - Executors: api/executors.md
      - Metrics: api/metrics.md
  - Tasks:
      - Overview: tasks/index.md
  - Development:
      - GitHub: https://github.com/Human-Agent-Society/tide-eval
      - Contributing: https://github.com/Human-Agent-Society/tide-eval/blob/main/CONTRIBUTING.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
