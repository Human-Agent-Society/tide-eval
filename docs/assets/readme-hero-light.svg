<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #22363E; }
    .m { fill: #7A929A; } .a { fill: #0E7490; } .c { fill: #D65F4A; }
    .lab { font-size: 14px; font-weight: 600; } .sm { font-size: 12.5px; }
    .draw { stroke: #22363E; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-f { stroke: #AABDC3; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-a { stroke: #0E7490; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-c { stroke: #D65F4A; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 5 6; }
  </style>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22363E"/>
    </marker>
    <marker id="m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0E7490"/>
    </marker>
    <marker id="m-cor" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#D65F4A"/>
    </marker>
  </defs>

  <!-- agent: a self-scoring loop and its climbing score log -->
  <path d="M 88 52 A 22 22 0 1 1 66 30" class="draw-c" marker-end="url(#m-cor)"/>
  <text x="104" y="50" class="lab">agent</text>
  <text x="104" y="70" class="sm m">scores itself, freely</text>

  <polyline points="42,208 76,208 76,188 112,188 112,192 146,192 146,164 188,164 188,168 220,168 220,142 256,142"
            class="draw-c"/>
  <circle cx="76" cy="188" r="3.5" fill="#D65F4A"/>
  <circle cx="146" cy="164" r="3.5" fill="#D65F4A"/>
  <circle cx="220" cy="142" r="3.5" fill="#D65F4A"/>
  <circle cx="256" cy="142" r="4.5" fill="#D65F4A"/>
  <text x="42" y="236" class="sm c">score log</text>

  <!-- the isolation line -->
  <line x1="330" y1="36" x2="330" y2="244" class="draw-f dash"/>
  <text x="330" y="268" text-anchor="middle" class="sm m">isolation</text>

  <!-- only declared artifacts cross -->
  <path d="M 272 116 H 302" class="draw"/>
  <rect x="312" y="96" width="34" height="42" rx="5" class="draw"/>
  <line x1="320" y1="110" x2="338" y2="110" class="draw-f"/>
  <line x1="320" y1="120" x2="338" y2="120" class="draw-f"/>
  <line x1="320" y1="130" x2="332" y2="130" class="draw-f"/>
  <path d="M 356 116 H 388" class="draw" marker-end="url(#m-ink)"/>
  <text x="330" y="84" text-anchor="middle" class="sm">artifacts</text>

  <!-- the claimed score bounces off -->
  <text x="316" y="198" text-anchor="end" class="sm c" text-decoration="line-through">score: 9.99</text>
  <path d="M 318 208 q 10 8 -4 16" class="draw-c" marker-end="url(#m-cor)"/>

  <!-- verifier -->
  <circle cx="448" cy="116" r="34" class="draw-a"/>
  <path d="M 432 116 l 11 12 l 22 -26" class="draw-a"/>
  <text x="448" y="176" text-anchor="middle" class="lab">verifier</text>
  <text x="448" y="196" text-anchor="middle" class="sm m">recomputes</text>

  <path d="M 492 116 H 552" class="draw-a" marker-end="url(#m-acc)"/>
  <text x="522" y="102" text-anchor="middle" class="sm a">trusted</text>

  <!-- one table, accumulating -->
  <text x="576" y="56" class="lab">one table</text>
  <circle cx="582" cy="82" r="3.5" fill="#0E7490"/>
  <line x1="596" y1="82" x2="716" y2="82" class="draw-a" stroke-width="3"/>
  <circle cx="582" cy="104" r="3" fill="#AABDC3"/>
  <line x1="596" y1="104" x2="700" y2="104" class="draw-f"/>
  <circle cx="582" cy="124" r="3" fill="#AABDC3"/>
  <line x1="596" y1="124" x2="708" y2="124" class="draw-f"/>
  <circle cx="582" cy="144" r="3" fill="#AABDC3"/>
  <line x1="596" y1="144" x2="694" y2="144" class="draw-f"/>

  <!-- curves are queries -->
  <path d="M 580 176 V 240 H 700" class="draw-f"/>
  <polyline points="586,232 610,232 610,216 636,216 636,204 662,204 662,190 692,190" class="draw-a"/>
  <circle cx="692" cy="190" r="4" fill="#0E7490"/>
  <text x="732" y="212" class="sm m">curves are</text>
  <text x="732" y="230" class="sm m">queries</text>
</svg>
