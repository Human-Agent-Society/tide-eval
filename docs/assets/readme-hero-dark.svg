<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #DCE9EC; }
    .m { fill: #8AA2AA; } .a { fill: #45B2C6; } .c { fill: #E57560; }
    .lab { font-size: 15px; font-weight: 600; } .sm { font-size: 13px; }
    .draw { stroke: #DCE9EC; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-f { stroke: #5F777E; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-a { stroke: #45B2C6; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-c { stroke: #E57560; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 5 6; }
  </style>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#DCE9EC"/>
    </marker>
    <marker id="m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#45B2C6"/>
    </marker>
    <marker id="m-cor" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E57560"/>
    </marker>
  </defs>

  <!-- 1 · the agent searches, scoring itself as it goes -->
  <path d="M 62 58 A 20 20 0 1 1 42 38" class="draw-c" marker-end="url(#m-cor)"/>
  <text x="78" y="56" class="lab">agent</text>
  <text x="36" y="100" class="sm m">scores itself while it searches</text>

  <polyline points="36,196 68,196 68,174 102,174 102,178 134,178 134,150 172,150 172,154 204,154 204,128 240,128"
            class="draw-c"/>
  <circle cx="68" cy="174" r="3.5" fill="#E57560"/>
  <circle cx="134" cy="150" r="3.5" fill="#E57560"/>
  <circle cx="204" cy="128" r="3.5" fill="#E57560"/>
  <circle cx="240" cy="128" r="4.5" fill="#E57560"/>
  <text x="36" y="224" class="sm c">its own scores — not trusted</text>

  <!-- 2 · an isolated verifier re-scores the solution -->
  <line x1="330" y1="52" x2="330" y2="214" class="draw-f dash"/>

  <path d="M 268 112 H 296" class="draw"/>
  <rect x="308" y="92" width="34" height="42" rx="5" class="draw"/>
  <line x1="316" y1="106" x2="334" y2="106" class="draw-f"/>
  <line x1="316" y1="116" x2="334" y2="116" class="draw-f"/>
  <line x1="316" y1="126" x2="328" y2="126" class="draw-f"/>
  <path d="M 348 112 H 386" class="draw" marker-end="url(#m-ink)"/>
  <text x="330" y="44" text-anchor="middle" class="sm m">its best solution</text>

  <circle cx="446" cy="112" r="34" class="draw-a"/>
  <path d="M 430 112 l 11 12 l 22 -26" class="draw-a"/>
  <text x="446" y="172" text-anchor="middle" class="lab">verifier</text>
  <text x="446" y="194" text-anchor="middle" class="sm m">isolated — re-scores the solution,</text>
  <text x="446" y="212" text-anchor="middle" class="sm m">ignoring what the agent claimed</text>

  <path d="M 490 112 H 552" class="draw-a" marker-end="url(#m-acc)"/>
  <text x="524" y="94" text-anchor="middle" class="sm a">trusted score</text>

  <!-- 3 · everything lands in one table -->
  <text x="576" y="56" class="lab">one table, every run</text>
  <circle cx="582" cy="86" r="3.5" fill="#45B2C6"/>
  <line x1="596" y1="86" x2="716" y2="86" class="draw-a" stroke-width="3"/>
  <text x="728" y="90" class="sm a">trusted score</text>
  <circle cx="582" cy="108" r="3" fill="#5F777E"/>
  <line x1="596" y1="108" x2="700" y2="108" class="draw-f"/>
  <circle cx="582" cy="128" r="3" fill="#5F777E"/>
  <line x1="596" y1="128" x2="708" y2="128" class="draw-f"/>
  <text x="728" y="122" class="sm m">the agent's own scores</text>

  <path d="M 580 158 V 218 H 700" class="draw-f"/>
  <polyline points="586,210 610,210 610,196 636,196 636,186 662,186 662,174 692,174" class="draw-a"/>
  <circle cx="692" cy="174" r="4" fill="#45B2C6"/>
  <text x="728" y="202" class="sm m">score over time</text>
</svg>
